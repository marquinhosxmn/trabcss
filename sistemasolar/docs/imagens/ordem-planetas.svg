<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="titulo desc">
<title id="titulo">Ordem dos planetas</title><desc id="desc">Da esquerda para a direita: Sol, Mercúrio, Vênus, Terra, Marte, Júpiter, Saturno, Urano e Netuno. Tamanhos não representam a escala real.</desc>
<rect width="960" height="330" fill="#f4f7fa"/>
<text x="30" y="40" font-family="Arial, sans-serif" font-size="22" fill="#233d52" font-weight="bold">Ordem dos planetas a partir do Sol</text>
<line x1="42" y1="175" x2="915" y2="175" stroke="#acb9c2" stroke-width="2" stroke-dasharray="6 8"/>
<circle cx="72" cy="175" r="31" fill="#f5aa33" stroke="#52616d" stroke-width="1"/><text x="72" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#233d52">Sol</text><circle cx="176" cy="175" r="11" fill="#999b9f" stroke="#52616d" stroke-width="1"/><text x="176" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#233d52">Mercúrio</text><circle cx="271" cy="175" r="18" fill="#bda26f" stroke="#52616d" stroke-width="1"/><text x="271" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#233d52">Vênus</text><circle cx="366" cy="175" r="20" fill="#398ac8" stroke="#52616d" stroke-width="1"/><text x="366" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#233d52">Terra</text><circle cx="459" cy="175" r="14" fill="#c77955" stroke="#52616d" stroke-width="1"/><text x="459" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#233d52">Marte</text><circle cx="565" cy="175" r="41" fill="#cfb48c" stroke="#52616d" stroke-width="1"/><text x="565" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#233d52">Júpiter</text><circle cx="687" cy="175" r="34" fill="#c6ad72" stroke="#52616d" stroke-width="1"/><ellipse cx="687" cy="175" rx="56" ry="12" fill="none" stroke="#99824f" stroke-width="5" transform="rotate(-18 687 175)"/><text x="687" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#233d52">Saturno</text><circle cx="786" cy="175" r="24" fill="#80cdd7" stroke="#52616d" stroke-width="1"/><text x="786" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#233d52">Urano</text><circle cx="885" cy="175" r="23" fill="#477abd" stroke="#52616d" stroke-width="1"/><text x="885" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#233d52">Netuno</text><text x="30" y="300" font-family="Arial, sans-serif" font-size="14" fill="#5b6974">Representação ilustrativa. Os planetas não estão em escala.</text></svg>